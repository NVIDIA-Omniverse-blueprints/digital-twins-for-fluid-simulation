[package]
title = "RTWT Auto-Aero Hooks"
version = "1.0.0"  # Semantic Versioning: https://semver.org/
description = "Automotive-aero specialization callback adapters (the dynamic-pressure colormap policy) invoked by the use-case-agnostic controller binding engine."
category = "internal"  # specialization (see source/specializations/auto-aero)
keywords = ["kit", "rtwt", "auto_aero", "hooks", "specialization"]
readme = "docs/README.md"

[dependencies]
# Registers callbacks into the core controller's CallbackRegistry, so it must load after it.
"omni.rtwt.controller" = {}

[[python.module]]  # Publicly available as "import omni.rtwt.auto_aero.hooks"
name = "omni.rtwt.auto_aero.hooks"
